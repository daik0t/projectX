# Заглушки для CORS
app.cors.allowed-origins=http://localhost:5173

# Заглушки для JWT (минимум 32 символа для HS256)
jwt.secret=dGVzdC1zZWNyZXQta2V5LWZvci10ZXN0aW5nLW9ubHktMzJieXRlcw==
jwt.expiration-ms=86400000

# Заглушки для OAuth (чтобы контекст не падал)
spring.security.oauth2.client.registration.google.client-id=test-google-id
spring.security.oauth2.client.registration.google.client-secret=test-google-secret
spring.security.oauth2.client.registration.github.client-id=test-github-id
spring.security.oauth2.client.registration.github.client-secret=test-github-secret
app.oauth.frontend-url=http://localhost:5173

# Настройки базы данных для тестов (H2 в памяти)
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop